name: Build spine-godot (All Godot 4.x versions)

on:
  # Auto-run disabled: this fork ships the Godot 4.7 GDExtension, not the engine module.
  # Kept for manual runs only (Actions -> this workflow -> "Run workflow").
  workflow_dispatch:

jobs:
  build-versions:
    strategy:
      matrix:
        version:
          [
            {"tag": "4.6.3-stable", "version": "4.6.3.stable", "mono": false},
            {"tag": "4.6.3-stable", "version": "4.6.3.stable", "mono": true},
            {"tag": "4.7.1-stable", "version": "4.7.1.stable", "mono": false},
            {"tag": "4.7.1-stable", "version": "4.7.1.stable", "mono": true},
          ]
    uses: ./.github/workflows/spine-godot-v4.yml
    with:
      godot_tag: ${{ matrix.version.tag }}
      godot_version: ${{ matrix.version.version }}
      godot_mono: ${{ matrix.version.mono }}
    secrets: inherit
